<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="rail0 starter">
  <title>rail0 starter</title>
  <!--
    The tab icon, and the shop's mark.

    It replaces the Vercel triangle this template shipped with — a placeholder that
    said "made from a Next.js starter" where the icon should say what the thing is.

    The shape is rail0's own hexagon, so the storefront reads as part of that family
    rather than as an unrelated app. What is added is the fill: the hexagon is a
    CONTAINER holding value, which is what a rail0 payment literally is — funds sit
    in escrow between authorize and capture, held by the contract and owned by
    neither side yet. Half full, because half is the state the whole app is about;
    empty or full would both be the moment after.

    Two readings, and both are true of this repo: value held in escrow, and a
    template you are half-given and expected to finish.

    The fill line rises 6° to the right instead of sitting flat. That is the only
    decorative decision here, and it earns its place twice: it echoes the diagonal
    strokes inside the parent logo, and it keeps the mark from reading as a static
    two-tone shape. Steeper (10°+) starts to look like a tilted liquid; flat looks
    like an accident of cropping.

    Sized and tested down to 16px, which is where a favicon actually lives. Anything
    finer than one solid mass plus the outline turns to mud at that size — earlier
    drafts with interior strokes, arrows and a bag handle all failed there, which is
    why the meaning is carried by the fill and not by a symbol inside it.

    Two colour sets: browsers honour prefers-color-scheme inside an SVG favicon, and
    a near-black mark is invisible on a dark tab strip.
  -->
  <style>
    .ink { fill: #0a0a0a; }
    .line { fill: none; stroke: #0a0a0a; stroke-width: 1.7; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #fafafa; }
      .line { stroke: #fafafa; }
    }
  </style>
  <defs>
    <clipPath id="hex">
      <path d="M12 3.4 19.5 7.7v8.6L12 20.6 4.5 16.3V7.7Z" />
    </clipPath>
  </defs>
  <path class="ink" d="M0 13.3 24 10.7V24H0Z" clip-path="url(#hex)" />
  <path class="line" d="M12 3.4 19.5 7.7v8.6L12 20.6 4.5 16.3V7.7Z" />
</svg>
