<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="rail0 starter">
  <title>rail0 starter</title>
  <!--
    The tab icon, and the shop's mark.

    It replaces the Vercel triangle this template shipped with — a placeholder that
    said "made from a Next.js starter" where the icon should say what the thing is.

    The shape is rail0's own hexagon, so the storefront reads as part of that family
    rather than as an unrelated app. What is added is the fill: the hexagon is a
    CONTAINER holding value, which is what a rail0 payment literally is — funds sit
    in escrow between authorize and capture, held by the contract and owned by
    neither side yet. It reads a second way that is equally true of this repo: a
    template you are half-given and expected to finish.

    THE DIVIDING LINE RUNS VERTEX TO VERTEX — lower-left corner to upper-right
    corner — and that is the whole reason it looks intentional. An arbitrary height
    is a number someone picked; a line that lands exactly on two corners is a
    property of the shape, and stays right at any size without being re-tuned.

    The direction is not free either: it rises to the right because the diagonal
    strokes inside the parent logo do. Run the other way (upper-left to lower-right)
    and the mark still works but stops rhyming with rail0, which is most of what it
    is here to do. The resulting ~30° is what the geometry dictates, not a taste.

    Sized and tested down to 16px, which is where a favicon actually lives. Anything
    finer than one solid mass plus the outline turns to mud there — drafts with
    interior strokes, arrows, facing chevrons and a bag handle were all rendered and
    failed at that size, which is why the meaning is carried by the fill and not by
    a symbol inside the hexagon.

    Two colour sets: browsers honour prefers-color-scheme inside an SVG favicon, and
    a near-black mark is invisible on a dark tab strip.
  -->
  <style>
    .ink { fill: #0a0a0a; }
    .line { fill: none; stroke: #0a0a0a; stroke-width: 1.7; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #fafafa; }
      .line { stroke: #fafafa; }
    }
  </style>
  <defs>
    <clipPath id="hex">
      <path d="M12 3.4 19.5 7.7v8.6L12 20.6 4.5 16.3V7.7Z" />
    </clipPath>
  </defs>
  <path class="ink" d="M4.5 16.3 19.5 7.7v8.6L12 20.6Z" clip-path="url(#hex)" />
  <path class="line" d="M12 3.4 19.5 7.7v8.6L12 20.6 4.5 16.3V7.7Z" />
</svg>
